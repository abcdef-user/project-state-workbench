<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f8f7f4">
  <title>项目工作台</title>
  <link rel="stylesheet" href="/style.css">
  <script defer src="/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#content">跳到主要内容</a>

  <aside class="sidebar">
    <button class="brand" type="button" data-action="go-home" aria-label="返回全域项目">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none">
          <circle cx="16" cy="16" r="8.4" stroke="currentColor" stroke-width="1.35"/>
          <circle cx="16" cy="16" r="3.1" stroke="currentColor" stroke-width="1.35"/>
          <path d="M16 1.6v6.3M16 24.1v6.3M1.6 16h6.3M24.1 16h6.3M5.9 5.9l4.5 4.5M21.6 21.6l4.5 4.5M26.1 5.9l-4.5 4.5M10.4 21.6l-4.5 4.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="brand-copy"><strong>项目工作台</strong><small>LOCAL PROJECT BOARD</small></span>
    </button>

    <div class="sidebar-label">工作区 / WORKSPACE</div>
    <nav aria-label="项目导航">
      <button class="nav-item nav-home" data-action="go-home">
        <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 20 20" fill="none"><path d="M2.8 7.2 10 2.5l7.2 4.7v9H2.8v-9Z" stroke="currentColor" stroke-linejoin="round"/><path d="M7.4 16.2v-5.4h5.2v5.4" stroke="currentColor" stroke-linejoin="round"/></svg></span>
        <span class="nav-text">全域项目</span>
      </button>
      <div class="project-nav">
        <button class="nav-item" data-view="overview">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 20 20" fill="none"><rect x="2.5" y="2.5" width="6" height="6" rx="1.2" stroke="currentColor"/><rect x="11.5" y="2.5" width="6" height="6" rx="1.2" stroke="currentColor"/><rect x="2.5" y="11.5" width="6" height="6" rx="1.2" stroke="currentColor"/><rect x="11.5" y="11.5" width="6" height="6" rx="1.2" stroke="currentColor"/></svg></span>
          <span class="nav-text">项目总览</span><span class="nav-no">01</span>
        </button>
        <button class="nav-item" data-view="tasks">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 20 20" fill="none"><path d="M3 5h2M8 5h9M3 10h2M8 10h9M3 15h2M8 15h9" stroke="currentColor" stroke-linecap="round"/></svg></span>
          <span class="nav-text">任务看板</span><i id="nav-task-count" class="nav-count">—</i><span class="nav-no">02</span>
        </button>
        <button class="nav-item" data-view="decisions">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 20 20" fill="none"><path d="M10 2.8 17.2 10 10 17.2 2.8 10 10 2.8Z" stroke="currentColor" stroke-linejoin="round"/><path d="m7.1 10 2 2 3.8-4" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <span class="nav-text">讨论与决定</span><span class="nav-no">03</span>
        </button>
        <button class="nav-item" data-view="history">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 20 20" fill="none"><path d="M4.2 6.2A7 7 0 1 1 3 10" stroke="currentColor" stroke-linecap="round"/><path d="M4.2 2.8v3.8H8" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 6.4V10l2.5 1.7" stroke="currentColor" stroke-linecap="round"/></svg></span>
          <span class="nav-text">历史记录</span><span class="nav-no">04</span>
        </button>
        <button class="nav-item" data-view="rules">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 20 20" fill="none"><path d="M5 2.8h7.2L15 5.7v11.5H5V2.8Z" stroke="currentColor" stroke-linejoin="round"/><path d="M12 2.9v3h3M7.6 9h4.8M7.6 12h4.8" stroke="currentColor" stroke-linecap="round"/></svg></span>
          <span class="nav-text">登记原则</span><span class="nav-no">05</span>
        </button>
        <button class="nav-item" data-view="settings">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="2.7" stroke="currentColor"/><path d="M10 2.6v2M10 15.4v2M2.6 10h2M15.4 10h2M4.8 4.8l1.4 1.4M13.8 13.8l1.4 1.4M15.2 4.8l-1.4 1.4M6.2 13.8l-1.4 1.4" stroke="currentColor" stroke-linecap="round"/></svg></span>
          <span class="nav-text">项目设置</span><span class="nav-no">06</span>
        </button>
      </div>
    </nav>

    <div class="sidebar-bottom">
      <div class="project-only sidebar-project">
        <span class="tiny-label">当前项目 / PROJECT</span>
        <strong id="sidebar-project-name">—</strong>
        <p id="sidebar-project-desc">—</p>
        <span id="sidebar-project-path" class="side-path"></span>
        <div class="sidebar-actions">
          <button type="button" data-action="go-home">切换项目</button>
          <button type="button" data-action="open-folder">打开文件夹</button>
        </div>
        <div class="sidebar-status"><span aria-hidden="true"></span>本机共享状态</div>
      </div>
      <div class="home-only">
        <span class="tiny-label">全域工作台 / GLOBAL</span>
        <strong>全部项目自动汇总</strong>
        <p>首页读取共享状态中已有的项目；也可以打开项目文件夹或新建项目。数据不上传网络。</p>
        <div class="sidebar-status"><span aria-hidden="true"></span>本机运行</div>
      </div>
    </div>
  </aside>

  <div class="workspace">
    <header class="topbar">
      <div class="breadcrumb">
        <button class="crumb-link" type="button" data-action="go-home">全域项目</button>
        <span id="breadcrumb-sep-project" class="crumb-sep" hidden>/</span>
        <strong id="breadcrumb-project" hidden></strong>
        <span class="crumb-sep">/</span>
        <strong id="breadcrumb-current">全域项目</strong>
      </div>
      <div class="top-actions">
        <span id="connection" class="connection"><b></b>正在连接</span>
        <span id="revision" class="version" hidden>第 — 版</span>
        <button class="button quiet compact" id="switch-project" type="button" data-action="go-home" hidden>切换项目</button>
        <button class="button quiet compact refresh-button" id="refresh" type="button">
          <svg viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M14.7 6.7A6 6 0 1 0 15 9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M14.8 2.9v3.9h-3.9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          刷新
        </button>
      </div>
    </header>

    <div id="offline-banner" class="banner" hidden>无法连接本机服务：当前页面不能保存修改。已填写的内容会留在窗口中，请确认工作台仍在运行后刷新。</div>
    <div id="export-banner" class="banner warning" hidden></div>

    <main id="content" tabindex="-1"><div class="loading">正在读取本机项目…</div></main>
    <footer class="page-footer"><span>修改只写入当前项目的共享状态，并保留历史。</span><span id="last-updated"></span></footer>
  </div>

  <dialog id="editor" class="drawer" aria-labelledby="editor-title">
    <form id="editor-form" novalidate>
      <div class="drawer-heading">
        <div><div id="editor-kicker" class="eyebrow"></div><h2 id="editor-title">编辑</h2></div>
        <button type="button" class="icon-button" id="close-editor" aria-label="关闭编辑窗口">×</button>
      </div>
      <div id="editor-body" class="drawer-body"></div>
      <div id="editor-error" class="inline-error" role="alert" hidden></div>
      <div id="editor-actions" class="drawer-actions"></div>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
